# Explicit opt-in: pass credentials from the host environment, never the build context.
services:
  reposleuth:
    environment:
      DEMO_ONLY: "0"
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      APP_BUDGET_USD: ${APP_BUDGET_USD:-1}
