name: Reliability checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scripted-evaluation
          path: data/evals/latest.json
          if-no-files-found: ignore
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker compose up --build -d --wait
      - run: npm run smoke:deployment
      - run: docker compose logs
        if: failure()
      - run: docker compose down
        if: always()
